[project]
name = "fnaf-help-wanted-archipelago"
version = "0.3.0"
description = "Archipelago multiworld integration for Five Nights at Freddy's: Help Wanted (apworld, launcher client, standalone client and UE4SS mod)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Max Epinat" }]
# The standalone client needs websockets; the apworld and the launcher client run on Archipelago's own bundled libraries.
dependencies = ["websockets>=12.0"]

[tool.setuptools]
packages = ["fnaf_help_wanted"]
